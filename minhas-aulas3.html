<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eProf - Minhas aulas 3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; display: flex; height: 100vh; overflow: hidden; font-size: 13px; color: #333; }

    /* SIDEBAR */
    .sidebar {
      width: 168px;
      min-width: 168px;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #eee;
      padding-bottom: 12px;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: #f26522;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 13px;
      letter-spacing: -0.5px;
    }
    .logo-text { display: flex; flex-direction: column; }
    .logo-text .eprof { font-weight: 700; font-size: 14px; color: #f26522; }
    .logo-badge {
      background: #f26522; color: #fff;
      font-size: 8px; font-weight: 700;
      padding: 1px 5px; border-radius: 3px;
      letter-spacing: 0.5px;
      margin-top: 1px;
      width: fit-content;
    }
    .logo-img { width: 104px; height: auto; display: block; }
    .nav { flex: 1; padding: 8px 0; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px;
      color: #666; cursor: pointer;
      border-radius: 0;
      font-size: 13px;
      transition: background 0.15s;
    }
    .nav-item:hover { background: #fef5f0; }
    .nav-item.active { background: #fef5f0; color: #f26522; font-weight: 600; border-right: 3px solid #f26522; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .sidebar-bottom {
      padding: 8px 16px;
      border-top: 1px solid #f0f0f0;
    }
    .logout {
      display: flex; align-items: center; gap: 8px;
      color: #888; cursor: pointer; font-size: 13px; padding: 6px 0;
    }
    .logout svg { width: 16px; height: 16px; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* TOP BAR */
    .topbar {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-left .icon-cal {
      color: #f26522;
    }
    .topbar-title { font-size: 17px; font-weight: 700; color: #222; }
    .topbar-sub { font-size: 12px; color: #888; margin-top: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #f26522; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px;
    }
    .user-info { text-align: right; }
    .user-name { font-weight: 600; font-size: 13px; color: #222; }
    .user-role { font-size: 11px; color: #888; }

    /* CALENDAR HEADER */
    .cal-header {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .month-nav { display: flex; align-items: center; gap: 12px; }
    .month-nav button {
      background: none; border: none; cursor: pointer;
      color: #666; font-size: 16px; padding: 2px 6px;
      border-radius: 4px;
    }
    .month-nav button:hover { background: #f5f5f5; }
    .month-label { font-weight: 600; font-size: 14px; color: #222; }
    .legend { display: flex; align-items: center; gap: 16px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-orange { background: #f26522; }
    .dot-blue { background: #1e4db7; }
    .today-btn {
      display: flex; align-items: center; gap: 6px;
      border: 1px solid #ddd; background: #fff;
      padding: 5px 12px; border-radius: 6px;
      font-size: 12px; color: #444; cursor: pointer;
    }
    .today-btn:hover { background: #f9f9f9; }

    /* GRID */
    .cal-grid-wrapper { flex: 1; overflow-x: auto; overflow-y: auto; }
    .cal-grid {
      display: grid;
      grid-template-columns: 168px repeat(6, 1fr);
      min-width: 900px;
      grid-template-rows: auto auto;
      align-items: start;
    }

    /* Day column headers */
    .day-col-header { padding: 8px 8px 0; background: #fafbfd; }
    .day-col-header.today-col { background: #fffaf7; }
    .day-header-box { border: 1px solid #e0e0e0; border-radius: 10px; padding: 7px 10px; text-align: center; background: #fff; }
    .day-header-box.today { border-color: #f26522; }
    .day-name { font-size: 11px; color: #aaa; margin-bottom: 2px; }
    .day-num { font-size: 22px; font-weight: 600; color: #555; line-height: 1.2; }
    .day-header-box.today .day-name { color: #f26522; }
    .day-header-box.today .day-num { color: #f26522; }
    .row-label-header { background: #fafbfd; }

    /* Day cells */
    .day-cell {
      border-right: 1px solid #eee;
      background: #fafbfd;
      padding: 0 8px 12px;
      min-width: 0;
    }
    .day-cell.today-col { background: #fffaf7; }

    .period-label {
      font-size: 10px; font-weight: 700; color: #aaa;
      letter-spacing: 0.8px; padding: 10px 0 6px;
      text-transform: uppercase;
    }

    /* CLASS CARD */
    .class-card {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #eee;
      padding: 9px 10px;
      margin-bottom: 6px;
    }
    .card-tag {
      display: inline-block;
      font-size: 10px; font-weight: 600;
      padding: 2px 7px; border-radius: 4px;
      margin-bottom: 5px;
    }
    .tag-orange { background: #fff0e8; color: #f26522; }
    .tag-blue { background: #e8eefa; color: #1e4db7; }
    .card-title { font-size: 13px; font-weight: 600; color: #222; margin-bottom: 4px; }
    .card-info { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #888; margin-bottom: 2px; }
    .card-info svg { width: 11px; height: 11px; flex-shrink: 0; }
    .card-link {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 500;
      margin-top: 5px;
    }
    .link-plan { color: #1e4db7; }
    .link-warn { color: #e0a020; }
    .link-plan svg, .link-warn svg { width: 12px; height: 12px; }
    .card-ext { float: right; color: #aaa; margin-top: -2px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f5f5f5; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    /* card clickable */
    .class-card { cursor: pointer; }
    .class-card:hover { border-color: #f26522; box-shadow: 0 2px 8px rgba(242,101,34,0.12); transform: translateY(-1px); transition: all 0.15s; }

    /* help button */
    .help-btn {
      position: fixed; bottom: 20px; right: 20px;
      width: 36px; height: 36px; border-radius: 50%;
      background: #555; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    /* ===== Menu mobile (hambúrguer + drawer) ===== */
    .hamburger { display: none; align-items: center; justify-content: center; width: 34px; height: 34px; border: none; background: none; cursor: pointer; color: #444; padding: 0; margin-right: 2px; flex-shrink: 0; }
    .hamburger svg { width: 22px; height: 22px; }
    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; }
    .topbar-logo { display: none; }
    @media (max-width: 768px) {
      .hamburger { display: flex; }
      .sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 200; transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 2px 0 16px rgba(0,0,0,0.15); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.open { display: block; }
      .main { display: block; overflow-y: auto; }
      .topbar { position: sticky; top: 0; z-index: 50; padding: 10px 14px; }
      .topbar-left > .icon-cal, .topbar-left > div { display: none; }
      .topbar-logo { display: block; position: absolute; left: 50%; transform: translateX(-50%); height: 26px; }
      .topbar-right .user-name, .topbar-right .user-role { display: none; }
    }
  </style>

</head>

  <!-- PAINEL DE CALENDÁRIO (semana) -->
  <style>
    .ma2-wrap{flex:1;overflow-y:auto;padding:24px 30px 14px;}
    .cal-panel{border:1px solid var(--borda,#e8eaee);border-radius:18px;padding:16px;margin:0 0 22px;background:#fff;}
    .cal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
    .month-sel{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#1f2937;}
    .month-sel .cal-ic{color:var(--laranja,#ED6939);flex:0 0 auto;}
    .month-sel .chev{color:#9aa2b1;flex:0 0 auto;}
    .cal-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .view-toggle2{display:flex;background:#f1f3f6;border-radius:12px;padding:4px;}
    .view-toggle2 button{border:0;background:transparent;padding:9px 20px;border-radius:9px;font-weight:600;font-size:14px;color:#5b6472;cursor:pointer;font-family:inherit;transition:.15s;}
    .view-toggle2 button.active{background:var(--laranja,#ED6939);color:#fff;box-shadow:0 2px 6px rgba(237,105,57,.3);}
    .btn-hoje{border:1px solid var(--borda,#e8eaee);background:#fff;border-radius:11px;padding:10px 20px;font-weight:600;font-size:14px;color:#1f2937;cursor:pointer;font-family:inherit;}
    .btn-hoje:hover{border-color:var(--laranja,#ED6939);color:var(--laranja,#ED6939);}
    .nav-arrow{width:42px;height:42px;border:1px solid var(--borda,#e8eaee);background:#fff;border-radius:11px;cursor:pointer;color:#4b5563;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;}
    .nav-arrow:hover{border-color:var(--laranja,#ED6939);color:var(--laranja,#ED6939);}
    .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
    .week-day{border:1px solid var(--borda,#e8eaee);border-radius:14px;padding:15px 6px;text-align:center;cursor:pointer;background:#fbfbfc;transition:.15s;}
    .week-day:hover{border-color:var(--laranja,#ED6939);background:#fff;}
    .week-day .wd-dow{font-size:13px;color:#8a94a6;margin-bottom:5px;}
    .week-day .wd-num{font-size:22px;font-weight:700;color:#1f2937;}
    .week-day.sel:not(.hoje){background:#fff;border-color:#12509A;box-shadow:0 0 0 1px #12509A inset;}
    .week-day.sel:not(.hoje) .wd-dow,.week-day.sel:not(.hoje) .wd-num{color:#12509A;}
    .week-day.hoje{background:var(--laranja,#ED6939);border-color:var(--laranja,#ED6939);box-shadow:0 6px 15px rgba(237,105,57,.28);}
    .week-day.hoje .wd-dow,.week-day.hoje .wd-num{color:#fff;}

    .dia-head{display:flex;align-items:center;gap:12px;margin:0 0 18px;flex-wrap:wrap;}
    .dia-head h2{font-size:22px;font-weight:800;color:#12223a;margin:0;}
    .badge-aulas{background:#fdece3;color:var(--laranja,#ED6939);font-weight:700;font-size:13px;padding:5px 13px;border-radius:20px;}

    .aulas-list{display:flex;flex-direction:column;gap:14px;padding-bottom:40px;}
    .aula-card{position:relative;display:flex;align-items:center;gap:20px;border:1px solid var(--borda,#e8eaee);border-radius:16px;padding:20px 22px 20px 26px;background:#fff;cursor:pointer;transition:.15s;}
    .aula-card:hover{box-shadow:0 6px 18px rgba(20,40,80,.09);border-color:#d9dee6;}
    .aula-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--laranja,#ED6939);}
    .aula-card.inf::before{background:#12509A;}
    .ac-disc{flex:0 0 210px;min-width:0;}
    .disc-tag{display:inline-flex;align-items:center;gap:7px;background:#fdece3;color:var(--laranja,#ED6939);font-weight:600;font-size:14px;padding:6px 12px;border-radius:9px;}
    .aula-card.inf .disc-tag{background:#e7effa;color:#12509A;}
    .disc-tag svg{width:16px;height:16px;flex:0 0 auto;}
    .ac-turma{font-size:22px;font-weight:800;color:#12223a;margin-top:12px;}
    .ac-local{flex:0 1 300px;min-width:190px;display:flex;flex-direction:column;gap:11px;}
    .ac-info{display:flex;align-items:center;gap:9px;color:#4b5563;font-size:15px;}
    .ac-info svg{width:18px;height:18px;color:#8a94a6;flex:0 0 auto;}
    .ac-status{flex:0 0 auto;display:flex;flex-direction:column;gap:11px;}
    .st-chamada{display:flex;align-items:center;gap:8px;color:#1a9d54;font-weight:600;font-size:15px;}
    .st-chamada svg{width:18px;height:18px;flex:0 0 auto;}
    .st-chamada.pend{color:#c07a00;}
    .plano-pill{display:inline-flex;align-items:center;gap:8px;background:#f1f3f6;color:#6b7280;font-size:14px;padding:8px 12px;border-radius:9px;width:fit-content;}
    .plano-pill svg{width:16px;height:16px;flex:0 0 auto;}
    .plano-pill.ok{background:#e9f6ee;color:#1a9d54;}
    .ac-ext{flex:0 0 auto;margin-left:auto;color:var(--laranja,#ED6939);}
    .ac-ext svg{width:22px;height:22px;}
    .aula-vazia{padding:44px 20px;text-align:center;color:#8a94a6;font-size:15px;border:1px dashed var(--borda,#e8eaee);border-radius:16px;}
    .aulas-grid .aula-vazia{grid-column:1/-1;}
    .dia-head3{margin:0 0 18px;}
    .dia-head3 .dh-dow{font-size:24px;font-weight:800;color:#12223a;line-height:1.1;}
    .dia-head3 .dh-sub{font-size:14px;color:#8a94a6;margin-top:4px;}
    .aulas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding-bottom:40px;}
    .aula-card3{position:relative;display:flex;flex-direction:column;gap:12px;border:1px solid var(--borda,#e8eaee);border-radius:16px;padding:18px 20px 18px 22px;background:#fff;cursor:pointer;transition:.15s;}
    .aula-card3:hover{box-shadow:0 6px 18px rgba(20,40,80,.09);border-color:#d9dee6;}
    .aula-card3::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--laranja,#ED6939);}
    .aula-card3.inf::before{background:#12509A;}
    .aula-card3.inf .disc-tag{background:#e7effa;color:#12509A;}
    .ac3-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
    .ac3-ext{color:var(--laranja,#ED6939);flex:0 0 auto;}
    .ac3-ext svg{width:20px;height:20px;}
    .ac3-mid{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
    .ac3-turma{font-size:20px;font-weight:800;color:#12223a;}
    .ac3-hora{display:flex;align-items:center;gap:7px;color:#4b5563;font-size:14px;white-space:nowrap;}
    .ac3-hora svg{width:16px;height:16px;color:#8a94a6;flex:0 0 auto;}
    .ac3-escola{display:flex;align-items:center;gap:8px;color:#4b5563;font-size:14px;}
    .ac3-escola svg{width:17px;height:17px;color:#8a94a6;flex:0 0 auto;}
    .ac3-div{height:1px;background:var(--borda,#e8eaee);margin:2px 0;}
    .ac3-status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
    .ac3-plano{display:flex;align-items:center;gap:8px;color:#8a94a6;font-size:14px;}
    .ac3-plano svg{width:16px;height:16px;flex:0 0 auto;}
    .ac3-plano.ok{color:#1a9d54;}
    @media(max-width:1080px){.aulas-grid{grid-template-columns:1fr;}}

    @media(max-width:860px){
      .aula-card{flex-wrap:wrap;gap:14px;}
      .ac-disc{flex:1 1 100%;}
      .ac-turma{margin-top:8px;}
      .ac-local,.ac-status{flex:1 1 45%;}
      .ac-ext{position:absolute;top:16px;right:16px;}
    }
    @media(max-width:600px){
      .ma2-wrap{padding:16px 16px 10px;}
      .cal-top{flex-direction:column;align-items:stretch;}
      .cal-actions{justify-content:space-between;}
      .view-toggle2{flex:1;}
      .view-toggle2 button{flex:1;padding:9px 8px;}
      .week-strip{display:flex;overflow-x:auto;gap:8px;scrollbar-width:thin;}
      .week-day{flex:0 0 58px;padding:12px 4px;}
      .week-day .wd-num{font-size:19px;}
      .ac-status{flex:1 1 100%;}
    }
  </style>

  <div class="ma2-wrap">
  <div class="cal-panel">
    <div class="cal-top">
      <div class="month-sel">
        <svg class="cal-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="mesLabel">Maio de 2026</span>
      </div>
      <div class="cal-actions">
        <div class="view-toggle2" id="viewToggle">
          <button class="active" data-tipo="regular" onclick="setTipoView('regular')">Ensino Regular</button>
          <button data-tipo="infantil" onclick="setTipoView('infantil')">Ed. Infantil</button>
        </div>
        <button class="btn-hoje" onclick="irHoje()">Hoje</button>
        <button class="nav-arrow" onclick="mudarSemana(-1)" aria-label="Semana anterior">&#8249;</button>
        <button class="nav-arrow" onclick="mudarSemana(1)" aria-label="Próxima semana">&#8250;</button>
      </div>
    </div>
    <div class="week-strip" id="weekStrip"></div>
  </div>

  <!-- CABEÇALHO DO DIA -->
  <div class="dia-head3">
    <div class="dh-dow" id="diaDow"></div>
    <div class="dh-sub" id="diaSub"></div>
  </div>

  <!-- AULAS DO DIA SELECIONADO -->
  <div class="aulas-grid" id="aulasList"></div>
  </div>

</div>


<script>
const SERIE_MAP = {
  '1° ano A':'1° ano – Ensino Fundamental I',
  '2° ano A':'2° ano – Ensino Fundamental I',
  '3° ano A':'3° ano – Ensino Fundamental I',
  'CN III':'Creche – Faixa CN III',
  'CN II':'Creche – Faixa CN II',
  'PN I':'Pré-escola – Faixa PN I',
  'PN II':'Pré-escola – Faixa PN II',
};

const ESCOLA_REG = 'Col. Municipal de Porto Seguro';
const ESCOLA_INF = 'CMEI Estrela do Mar';

// Aulas por dia do mês (maio/2026)
const AULAS = {
  11:[
    {tipo:'regular',tag:'Arte',turma:'2° ano A',escola:ESCOLA_REG,hora:'07:50 – 08:20',plano:false,chamada:'validada'},
    {tipo:'regular',tag:'Educação Física',turma:'3° ano A',escola:ESCOLA_REG,hora:'08:20 – 09:10',plano:true,planoNome:'Jogos cooperativos',chamada:'validada'},
    {tipo:'infantil',tag:'',turma:'PN I',escola:ESCOLA_INF,hora:'13:00 – 17:30',plano:true,chamada:'validada'},
  ],
  12:[
    {tipo:'regular',tag:'Agroecologia',turma:'1° ano A',escola:ESCOLA_REG,hora:'07:50 – 08:20',plano:false,chamada:'validada'},
    {tipo:'regular',tag:'Arte',turma:'2° ano A',escola:ESCOLA_REG,hora:'08:20 – 09:10',plano:false,chamada:'validada'},
    {tipo:'infantil',tag:'',turma:'CN III',escola:ESCOLA_INF,hora:'13:00 – 17:30',plano:false,chamada:'validada'},
  ],
  13:[
    {tipo:'regular',tag:'Educação Física',turma:'1° ano A',escola:ESCOLA_REG,hora:'07:50 – 08:20',plano:false,chamada:'validada'},
    {tipo:'regular',tag:'Arte',turma:'3° ano A',escola:ESCOLA_REG,hora:'08:20 – 09:10',plano:true,planoNome:'Releitura de obras',chamada:'validada'},
    {tipo:'infantil',tag:'',turma:'PN II',escola:ESCOLA_INF,hora:'13:00 – 17:30',plano:false,chamada:'validada'},
  ],
  14:[
    {tipo:'regular',tag:'Educação Física',turma:'2° ano A',escola:ESCOLA_REG,hora:'07:50 – 08:20',plano:false,chamada:'validada'},
    {tipo:'regular',tag:'Educação Física',turma:'3° ano A',escola:ESCOLA_REG,hora:'08:20 – 09:10',plano:false,chamada:'validada'},
    {tipo:'regular',tag:'Arte',turma:'1° ano A',escola:ESCOLA_REG,hora:'09:10 – 10:00',plano:true,planoNome:'Plano de Aula sobre Meio Ambiente',chamada:'validada'},
    {tipo:'infantil',tag:'',turma:'CN III',escola:ESCOLA_INF,hora:'13:00 – 17:30',plano:true,chamada:'validada'},
  ],
  15:[
    {tipo:'regular',tag:'Educação Física',turma:'2° ano A',escola:ESCOLA_REG,hora:'07:50 – 08:20',plano:false},
    {tipo:'regular',tag:'Arte',turma:'3° ano A',escola:ESCOLA_REG,hora:'08:20 – 09:10',plano:false},
    {tipo:'infantil',tag:'',turma:'PN I',escola:ESCOLA_INF,hora:'13:00 – 17:30',plano:true},
  ],
  18:[
    {tipo:'regular',tag:'Arte',turma:'2° ano A',escola:ESCOLA_REG,hora:'07:50 – 08:20',plano:false},
    {tipo:'regular',tag:'Arte',turma:'3° ano A',escola:ESCOLA_REG,hora:'08:20 – 09:10',plano:false},
    {tipo:'infantil',tag:'',turma:'CN II',escola:ESCOLA_INF,hora:'13:00 – 17:30',plano:false},
  ],
  19:[
    {tipo:'regular',tag:'Agroecologia',turma:'2° ano A',escola:ESCOLA_REG,hora:'07:50 – 08:20',plano:false},
    {tipo:'infantil',tag:'',turma:'PN II',escola:ESCOLA_INF,hora:'13:00 – 17:30',plano:false},
  ],
};

const ANO=2026, MES_IDX=4, HOJE=14;
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW_ABBR=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOW_FULL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const HOJE_DATE=new Date(ANO,MES_IDX,HOJE);
let selDate=new Date(ANO,MES_IDX,HOJE);
let tipoView='regular';

const IC_BLD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18z"/><path d="M6 12H4a2 2 0 00-2 2v6a2 2 0 002 2h2"/><path d="M18 9h2a2 2 0 012 2v9a2 2 0 01-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></svg>';
const IC_CLK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
const IC_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 6h10M11 12h10M11 18h10"/><path d="M3 6l1.4 1.4L6.2 4.6"/><path d="M3 12l1.4 1.4L6.2 10.6"/><path d="M3 18l1.4 1.4L6.2 16.6"/></svg>';
const IC_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
const IC_FILE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
const IC_EXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
const IC_BOOK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>';
const IC_ACT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>';
const IC_LEAF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>';
const IC_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

const DISC_IC={ 'Arte':IC_BOOK, 'Educação Física':IC_ACT, 'Agroecologia':IC_LEAF };

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function aulasDe(d){ return (d.getFullYear()===ANO&&d.getMonth()===MES_IDX)?(AULAS[d.getDate()]||[]):[]; }
function weekStart(d){ const x=new Date(d); const w=x.getDay(); x.setDate(x.getDate()+(w===0?-6:1-w)); return x; }

function renderWeek(){
  document.getElementById('mesLabel').textContent = MESES[selDate.getMonth()]+' de '+selDate.getFullYear();
  const strip=document.getElementById('weekStrip'); strip.innerHTML='';
  const start=weekStart(selDate);
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const cell=document.createElement('div');
    cell.className='week-day'+(sameDay(d,selDate)?' sel':'')+(sameDay(d,HOJE_DATE)?' hoje':'');
    cell.innerHTML='<div class="wd-dow">'+DOW_ABBR[d.getDay()]+'</div><div class="wd-num">'+d.getDate()+'</div>';
    cell.addEventListener('click',()=>{ selDate=d; render(); });
    strip.appendChild(cell);
  }
}

function cardHtml(a){
  const inf=a.tipo==='infantil';
  const tagTxt=inf?(a.tag||'Ed. Infantil'):a.tag;
  const ic=DISC_IC[a.tag]||(inf?IC_SUN:IC_BOOK);
  const chamada=a.chamada==='validada'
    ? '<div class="st-chamada">'+IC_CHECK+'Chamada validada</div>'
    : (a.chamada==='pendente' ? '<div class="st-chamada pend">'+IC_WARN+'Chamada pendente</div>' : '<div></div>');
  const planoTxt=a.planoNome || ('Planejamento '+(inf?'semanal ':'')+'vinculado');
  const plano=a.plano
    ? '<div class="ac3-plano ok">'+IC_FILE+planoTxt+'</div>'
    : '<div class="ac3-plano">'+IC_WARN+'Nenhum plano '+(inf?'semanal ':'de aula ')+'vinculado</div>';
  return '<div class="aula-card3'+(inf?' inf':'')+'">'
    +'<div class="ac3-top"><span class="disc-tag">'+ic+tagTxt+'</span><span class="ac3-ext">'+IC_EXT+'</span></div>'
    +'<div class="ac3-mid"><div class="ac3-turma">'+a.turma+'</div><div class="ac3-hora">'+IC_CLK+a.hora+'</div></div>'
    +'<div class="ac3-escola">'+IC_BLD+a.escola+'</div>'
    +'<div class="ac3-div"></div>'
    +'<div class="ac3-status">'+chamada+plano+'</div>'
    +'</div>';
}

function renderDia(){
  const lista=aulasDe(selDate).filter(a=>a.tipo===tipoView);
  document.getElementById('diaDow').textContent = cap(DOW_FULL[selDate.getDay()]);
  document.getElementById('diaSub').textContent = selDate.getDate()+' de '+MESES[selDate.getMonth()].toLowerCase()+' · '+lista.length+(lista.length===1?' aula':' aulas');
  const cont=document.getElementById('aulasList');
  if(!lista.length){
    cont.innerHTML='<div class="aula-vazia">Nenhuma aula '+(tipoView==='infantil'?'de Educação Infantil':'de Ensino Regular')+' neste dia.</div>';
    return;
  }
  cont.innerHTML=lista.map(cardHtml).join('');
  cont.querySelectorAll('.aula-card3').forEach((card,i)=>{
    card.addEventListener('click',()=>abrirAula(lista[i]));
  });
}

function abrirAula(a){
  const serie=SERIE_MAP[a.turma]||a.turma;
  const disc=a.tipo==='infantil'?a.turma:(a.tag||'');
  const escola=a.escola.indexOf('Col')===0?'Colégio Municipal de Porto Seguro':a.escola;
  localStorage.setItem('aulaAtual', JSON.stringify({
    disc, turma:a.turma, hora:a.hora, diaNum:String(selDate.getDate()),
    diaNome:DOW_FULL[selDate.getDay()], mes:MESES[selDate.getMonth()].toLowerCase(),
    ano:String(selDate.getFullYear()), escola, serie, tipo:a.tipo
  }));
  location.href='aula.html';
}

function setTipoView(tipo){
  tipoView=tipo;
  document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active', b.dataset.tipo===tipo));
  renderDia();
}
function irHoje(){ selDate=new Date(HOJE_DATE); render(); }
function mudarSemana(n){ const d=new Date(selDate); d.setDate(d.getDate()+7*n); selDate=d; render(); }
function render(){ renderWeek(); renderDia(); }

function toggleSidebar(){
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
}

render();
</script>

</body>
</html>
