<script>
// Mapa dia-número → nome e série padrão por turma
const DIA_NOMES = { '14':'Quinta','15':'Sexta','16':'Sábado','17':'Domingo','18':'Segunda','19':'Terça' };
const SERIE_MAP = {
  '1° ano A':'1° ano – Ensino Fundamental I',
  '2° ano A':'2° ano – Ensino Fundamental I',
  '3° ano A':'3° ano – Ensino Fundamental I',
  'CN III':'Creche – Faixa CN III',
  'CN II':'Creche – Faixa CN II',
  'PN I':'Pré-escola – Faixa PN I',
  'PN II':'Pré-escola – Faixa PN II',
};

// Associa cada coluna da grid ao número do dia
const colDias = ['14','15','16','17','18','19'];

document.querySelectorAll('.class-card').forEach(card => {
  // Descobre o dia: sobe até o day-cell, pega posição na grid
  const cell = card.closest('.day-cell');
  const grid = card.closest('.cal-grid');
  const cells = Array.from(grid.querySelectorAll('.day-cell'));
  const colIndex = cells.indexOf(cell); // 0-based
  const diaNum = colDias[colIndex] || '14';
  const diaNome = DIA_NOMES[diaNum] || '';

  // Lê dados do card
  const turma = card.querySelector('.card-title')?.textContent.trim() || '';
  const infos = card.querySelectorAll('.card-info');
  const hora  = infos[1]?.textContent.trim() || '';
  const tipo  = (card.getAttribute('style') || '').includes('1e4db7') ? 'infantil' : 'regular';
  const disc  = tipo === 'infantil' ? turma : (card.querySelector('.card-tag')?.textContent.trim() || '');
  const serie = SERIE_MAP[turma] || turma;

  card.addEventListener('click', () => {
    const dados = { disc, turma, hora, diaNum, diaNome, mes: 'maio', ano: '2026', escola: 'Colégio Municipal de Porto Seguro', serie, tipo };
    localStorage.setItem('aulaAtual', JSON.stringify(dados));
    location.href = 'aula.html';
  });
});
</script>

function getFichaParaTurma(tag) {
  if (!tag) return null;
  if (tag.includes('Berçário') || tag.match(/CN\s*I[^IV]/i) || tag.includes('CN I ') || tag.endsWith('CN I')) return FICHA_GRUPO1;
  if (tag.includes('CN II') || tag.includes('CN III')) return FICHA_GRUPO2;
  if (tag.includes('PN I') || tag.includes('PN II')) return FICHA_GRUPO3;
  return null;
}

let modalTab = 'regular';

// ============ SELECT TURMA ============
function selectTurma(turma) {
  currentTurma = turma;
  currentAluno = null;
  document.getElementById('detalheBar').style.display = 'none';
  document.getElementById('infoBar').style.display = '';
  document.getElementById('tabsBar').style.display = '';
  currentTab = turma.tag ? 'criancas' : 'inicio';
  renderInfoBar();
  renderTabs();
  renderContent();
}

// ============ DETALHE ALUNO ============
function openDetalheAluno(idx, source) {
  const list = source === 'criancas' ? CRIANCAS_MOCK : ALUNOS_MOCK;
  currentAluno = { ...list[idx], idx, source: source || 'alunos' };
  if (!('status' in currentAluno)) currentAluno.status = 'Ativo';
  if (!('ocorr' in currentAluno)) currentAluno.ocorr = 0;
  document.getElementById('detalheBar').style.display = '';
  document.getElementById('infoBar').style.display = 'none';
  document.getElementById('tabsBar').style.display = 'none';
  renderDetalheAluno();
}

function closeDetalheAluno() {
  currentAluno = null;
  document.getElementById('detalheBar').style.display = 'none';
  document.getElementById('infoBar').style.display = '';
  document.getElementById('tabsBar').style.display = '';
  renderContent();
}

// ============ FICHA PANEL ============
function openFichaPanel() {
  document.getElementById('fichaOverlay').classList.add('open');
  document.getElementById('fichaPanel').classList.add('open');
  renderFichaPanel();
}

function closeFichaPanel() {
  document.getElementById('fichaOverlay').classList.remove('open');
  document.getElementById('fichaPanel').classList.remove('open');
}

let fichaCampoAtual = 0;

function renderFichaPanel() {
  const a = currentAluno;
  const ficha = getFichaParaTurma(currentTurma.tag);
  const grupo = ficha === FICHA_GRUPO2 ? 'Grupo II' : 'Grupo I';
  document.getElementById('fichaPanelSub').textContent = a ? `${a.nome} — Perfil de Desenvolvimento · ${grupo}` : `Perfil de Desenvolvimento — ${grupo}`;
  fichaCampoAtual = 0;
  renderFichaCampo();
}

function renderFichaCampo() {
  const a = currentAluno;
  const si = fichaCampoAtual;
  const fichaAtual = getFichaParaTurma(currentTurma.tag) || FICHA_GRUPO1;
  const sec = fichaAtual[si];

  const legendHtml = `
    <div class=&quot;fr-legend&quot;>
      <div class=&quot;fr-leg-item&quot;><span class=&quot;fr-leg-badge fr-leg-sim&quot;>SIM</span> Sim</div>
      <div class=&quot;fr-leg-item&quot;><span class=&quot;fr-leg-badge fr-leg-av&quot;>AV</span> Às Vezes</div>
      <div class=&quot;fr-leg-item&quot;><span class=&quot;fr-leg-badge fr-leg-an&quot;>AN</span> Ainda Não</div>
      <div class=&quot;fr-leg-item&quot;><span class=&quot;fr-leg-badge fr-leg-nt&quot;>NT</span> Não Trabalhado</div>
    </div>`;

  const selectCampoHtml = `
    <div style=&quot;margin-bottom:14px;&quot;>
      <label style=&quot;font-size:11px;color:#aaa;display:block;margin-bottom:5px;&quot;>Campo de Experiência</label>
      <select style=&quot;width:100%;padding:8px 12px;font-size:13px;border-radius:8px;color:#1e4db7;font-weight:600;border:1.5px solid #1e4db7;outline:none;&quot; onchange=&quot;fichaCampoAtual=parseInt(this.value);renderFichaCampo()&quot;>
        ${fichaAtual.map((s, i) => `<option value=&quot;${i}&quot;${i===si?' selected':''}>${s.campo}</option>`).join('')}
      </select>
    </div>`;

  const opts = [
    {val:'sim', label:'SIM',  cls:'v-sim'},
    {val:'av',  label:'AV',   cls:'v-av'},
    {val:'an',  label:'AN',   cls:'v-an'},
    {val:'nt',  label:'NT',   cls:'v-nt'},
  ];

  const tableHtml = `
    <table class=&quot;fr-table&quot;>
      <thead><tr>
        <th>Indicadores</th>
        <th class=&quot;unid&quot;>I</th>
        <th class=&quot;unid&quot;>II</th>
        <th class=&quot;unid&quot;>III</th>
        <th class=&quot;unid&quot;>IV</th>
      </tr></thead>
      <tbody>
        ${sec.indicadores.map((ind, ii) => {
          const baseKey = `${a ? a.idx : 0}-${si}-${ii}`;
          return `<tr class=&quot;fr-obj-row&quot;>
            <td><span class=&quot;fr-num&quot;>${ii+1}</span>${ind}</td>
            ${[1,2,3,4].map(u => {
              const key = `${baseKey}-${u}`;
              const val = fichaRespostas[key] || '';
              const cls = opts.find(o=>o.val===val)?.cls || '';
              return `<td><select class=&quot;fr-select ${cls}&quot; onchange=&quot;salvarFichaSelect('${key}',this)&quot;>
                <option value=&quot;&quot;></option>
                ${opts.map(o=>`<option value=&quot;${o.val}&quot;${val===o.val?' selected':''}>${o.label}</option>`).join('')}
              </select></td>`;
            }).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  document.getElementById('fichaPanelBody').innerHTML = legendHtml + selectCampoHtml + tableHtml;
}

function salvarFichaSelect(key, sel) {
  const clsMap = {sim:'v-sim', av:'v-av', an:'v-an', nt:'v-nt'};
  sel.className = 'fr-select ' + (clsMap[sel.value] || '');
  if (sel.value) fichaRespostas[key] = sel.value;
  else delete fichaRespostas[key];
}

function saveFicha() {
  closeFichaPanel();
}

// ============ RELATÓRIO PANEL ============
let relUnidadeAtual = 1;
let relTextos = {}; // key: &quot;alunoIdx-unidade&quot;

const UNIDADES = ['Inicial', 'I Bimestre', 'II Bimestre', 'III Bimestre', 'IV Bimestre'];

function openRelPanel() {
  relUnidadeAtual = 1;
  document.getElementById('relOverlay').classList.add('open');
  document.getElementById('relPanel').classList.add('open');
  renderRelPanel();
}

function closeRelPanel() {
  // Salva o texto atual antes de fechar
  salvarTextoAtual();
  document.getElementById('relOverlay').classList.remove('open');
  document.getElementById('relPanel').classList.remove('open');
}

function salvarTextoAtual() {
  const ta = document.getElementById('relTextarea');
  if (ta &amp;&amp; currentAluno) {
    relTextos[`${currentAluno.idx}-${relUnidadeAtual}`] = ta.value;
  }
}

function renderRelPanel() {
  const a = currentAluno;
  document.getElementById('relPanelSub').textContent = a ? a.nome : '';

  const textoAtual = relTextos[`${a ? a.idx : 0}-${relUnidadeAtual}`] || '';
  const unidade = UNIDADES[relUnidadeAtual - 1];
  const titulo = unidade === 'Inicial' ? 'Relatório Inicial' : `Relatório do ${unidade}`;
  const placeholder = unidade === 'Inicial'
    ? 'Escreva o relatório inicial do aluno...'
    : `Escreva o relatório do ${unidade}...`;

  document.getElementById('relPanelBody').innerHTML = `
    <div class=&quot;rel-unid-tabs&quot;>
      ${UNIDADES.map((u, i) => `
        <span class=&quot;rel-unid-tab${relUnidadeAtual === i+1 ? ' active' : ''}&quot;
              onclick=&quot;trocarUnidade(${i+1})&quot;>${u}</span>`).join('')}
    </div>
    <div class=&quot;rel-unid-titulo&quot;>${titulo}</div>
    <textarea id=&quot;relTextarea&quot; class=&quot;rel-textarea&quot;
      placeholder=&quot;${placeholder}&quot;
      oninput=&quot;atualizarContador(this)&quot;>${textoAtual}</textarea>
    <div class=&quot;rel-char-count&quot; id=&quot;relCharCount&quot;>${textoAtual.length} caracteres</div>`;
}

function trocarUnidade(num) {
  salvarTextoAtual();
  relUnidadeAtual = num;
  renderRelPanel();
}

function atualizarContador(el) {
  document.getElementById('relCharCount').textContent = el.value.length + ' caracteres';
  if (currentAluno) relTextos[`${currentAluno.idx}-${relUnidadeAtual}`] = el.value;
}

function saveRel() {
  salvarTextoAtual();
  closeRelPanel();
}

    document.getElementById('infoFields').innerHTML = `

      <span class=&quot;info-label&quot;>${svg('cal')} Disciplina</span>   <span class=&quot;info-value&quot;><span class=&quot;badge-discipline&quot;>${t.disc}</span></span>
      <span class=&quot;info-label&quot;>${svg('pin')} Escola</span>       <span class=&quot;info-value&quot;>${t.escola}</span>
      <span class=&quot;info-label&quot;>${svg('clock')} Turno</span>      <span class=&quot;info-value&quot;>${t.turno}</span>
    `;
    document.getElementById('topbarActions').innerHTML = `
      <div class=&quot;select-turma-btn&quot; onclick=&quot;openModal('modalSelecionar')&quot;>${svg('ext')} Selecionar turma</div>

  } else {
    document.getElementById('infoFields').innerHTML = `

      <span class=&quot;info-label&quot;>${svg('clock')} Turno</span>         <span class=&quot;info-value&quot;>${t.turno}</span>
    `;
    document.getElementById('topbarActions').innerHTML = `
      <div class=&quot;ver-horarios-btn&quot; onclick=&quot;openHorarios()&quot;>${svg('clock')} Ver horários</div>
      <div class=&quot;select-turma-btn&quot; onclick=&quot;openModal('modalSelecionar')&quot;>${svg('ext')} Selecionar turma</div>
    `;
    const pct = Math.round((t.presentes / t.total) * 100);
    document.getElementById('progressLabel').textContent = `${t.presentes} de ${t.total} crianças`;
    document.getElementById('progressPct').textContent = `${pct}%`;
    document.getElementById('progressFill').className = 'progress-fill fill-blue';
    document.getElementById('progressFill').style.width = pct + '%';
  }

function renderTabs() {
  const isInfantil = !!currentTurma.tag;
  const tabs = isInfantil
    ? [['inicio','Início',svg('home')],['criancas','Alunos',svg('users')],['aulas','Aulas',svg('cal')],['ocorrencias','Ocorrências',svg('warn')],['acervo','Acervo',svg('folder')]]

function openModal(id) {
  if (id === 'modalSelecionar') renderModalList();

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.add('hidden'); });

}

function pickTurma(id) {
  closeModal('modalSelecionar');
  const t = [...TURMAS_REGULAR, ...TURMAS_INFANTIL].find(x => x.id === id);

function openHorarios() {
  const t = currentTurma;
  document.getElementById('horariosSubtitle').textContent = `${t.nome} · ${t.tag.split('·')[0].trim()}`;
  document.getElementById('horariosBody').innerHTML = t.horarios.map(h => `
    <div class=&quot;horario-row&quot;>
      <span>${h.nome}</span>
      <span class=&quot;horario-time&quot;><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; width=&quot;13&quot; height=&quot;13&quot;><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;10&quot;/><polyline points=&quot;12 6 12 12 16 14&quot;/></svg>${h.inicio} – ${h.fim}</span>
    </div>`).join('') + `
    <div class=&quot;horario-footer&quot;>
      <span>Turno: <strong style=&quot;color:#f26522&quot;>${t.turno.split('·')[0].trim()}</strong></span>
      <span>Total: <strong>${calcHoras(t.horarios)}</strong></span>
    </div>`;
  openModal('modalHorarios');
}

function calcHoras(horarios) {
  const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
  const ini = toMin(horarios[0].inicio);
  const fim = toMin(horarios[horarios.length-1].fim);
  const diff = fim - ini;
  return diff % 60 === 0 ? `${diff/60} horas` : `${Math.floor(diff/60)}h${diff%60}min`;
}

<script>
let horarios = [];

function openModal() {
  document.getElementById('modalAdicionar').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalAdicionar').classList.add('hidden');
}

document.getElementById('modalAdicionar').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function salvarHorario() {
  const ini = document.getElementById('inputInicio').value;
  const fim = document.getElementById('inputFim').value;
  if (!ini || !fim) return;
  horarios.push({ ini, fim, dias: ['','','','',''] });
  renderTabela();
  closeModal();
}

const clockSvg = `<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;10&quot;/><polyline points=&quot;12 6 12 12 16 14&quot;/></svg>`;
const editSvg  = `<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7&quot;/><path d=&quot;M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z&quot;/></svg>`;
const trashSvg = `<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><polyline points=&quot;3 6 5 6 21 6&quot;/><path d=&quot;M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6&quot;/><path d=&quot;M10 11v6&quot;/><path d=&quot;M14 11v6&quot;/><path d=&quot;M9 6V4h6v2&quot;/></svg>`;

function renderTabela() {
  const tbody = document.getElementById('tableBody');
  if (horarios.length === 0) {
    tbody.innerHTML = '<tr id=&quot;emptyRow&quot;><td colspan=&quot;7&quot; class=&quot;empty-state&quot;>Nenhum horário criado ainda</td></tr>';
    return;
  }
  tbody.innerHTML = horarios.map((h, i) => `
    <tr>
      <td>
        <div class=&quot;hora-cell-wrap&quot;>
          <div class=&quot;hora-times&quot;>
            <div class=&quot;hora-time&quot;>${clockSvg} ${h.ini}</div>
            <div class=&quot;hora-time&quot;>${clockSvg} ${h.fim}</div>
          </div>
          <div class=&quot;hora-actions&quot;>
            <button class=&quot;icon-btn edit&quot; onclick=&quot;editarHorario(${i})&quot; title=&quot;Editar&quot;>${editSvg}</button>
            <button class=&quot;icon-btn del&quot;  onclick=&quot;removerHorario(${i})&quot; title=&quot;Remover&quot;>${trashSvg}</button>
          </div>
        </div>
      </td>
      ${['Segunda','Terça','Quarta','Quinta','Sexta'].map((_, di) => {
        const val = h.dias[di];
        const turma = document.getElementById('selectTurma')?.value || '';
        if (val) {
          const [prof, rotina] = val.split(' · ');
          return `<td>
            <div class=&quot;slot-card&quot;>
              <div class=&quot;slot-info&quot; onclick=&quot;abrirSlot(${i},${di})&quot;>
                <div class=&quot;slot-rotina&quot;>${rotina || ''}</div>
                <div class=&quot;slot-turma&quot;>${turma}</div>
                <div class=&quot;slot-prof&quot;>${prof || ''}</div>
              </div>
              <button class=&quot;slot-del&quot; onclick=&quot;limparSlot(${i},${di})&quot; title=&quot;Remover&quot;>
                <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><polyline points=&quot;3 6 5 6 21 6&quot;/><path d=&quot;M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6&quot;/><path d=&quot;M10 11v6&quot;/><path d=&quot;M14 11v6&quot;/><path d=&quot;M9 6V4h6v2&quot;/></svg>
              </button>
            </div>
          </td>`;
        }
        return `<td><button class=&quot;add-slot-btn&quot; onclick=&quot;abrirSlot(${i},${di})&quot;>Adicionar <span class=&quot;plus&quot;>+</span></button></td>`;
      }).join('')}
      <td></td>
    </tr>`).join('');
}

// Slot atual sendo editado
let slotAtual = { row: null, col: null };

function abrirSlot(rowIdx, colIdx) {
  slotAtual = { row: rowIdx, col: colIdx };
  document.getElementById('slotProfessor').value = '';
  document.getElementById('slotRotina').value = '';
  // Pré-preencher se já existir
  const val = horarios[rowIdx]?.dias[colIdx] || '';
  if (val) {
    const parts = val.split(' · ');
    document.getElementById('slotProfessor').value = parts[0] || '';
    document.getElementById('slotRotina').value = parts[1] || '';
  }
  document.getElementById('modalSlot').classList.remove('hidden');
}

function closeModalSlot() {
  document.getElementById('modalSlot').classList.add('hidden');
}

document.getElementById('modalSlot').addEventListener('click', function(e) {
  if (e.target === this) closeModalSlot();
});

function salvarSlot() {
  const prof   = document.getElementById('slotProfessor').value;
  const rotina = document.getElementById('slotRotina').value;
  if (!prof &amp;&amp; !rotina) { closeModalSlot(); return; }
  const { row, col } = slotAtual;
  horarios[row].dias[col] = [prof, rotina].filter(Boolean).join(' · ');
  renderTabela();
  closeModalSlot();
}

function editarHorario(i) {
  const h = horarios[i];
  document.getElementById('inputInicio').value = h.ini;
  document.getElementById('inputFim').value = h.fim;
  // Salvar sobrescreve o mesmo índice
  document.querySelector('.btn-save').onclick = function() {
    horarios[i].ini = document.getElementById('inputInicio').value;
    horarios[i].fim = document.getElementById('inputFim').value;
    renderTabela();
    closeModal();
    document.querySelector('.btn-save').onclick = salvarHorario;
  };
  openModal();
}

function removerHorario(i) {
  horarios.splice(i, 1);
  renderTabela();
}

function limparSlot(rowIdx, colIdx) {
  horarios[rowIdx].dias[colIdx] = '';
  renderTabela();
}

function atualizarTurmas() {
  const tipo = document.getElementById('selectTipo').value;
  const select = document.getElementById('selectTurma');
  if (tipo === 'infantil') {
    select.innerHTML = `
      <option>Berçário – Grupo 1</option>
      <option>CN I – Grupo 1</option>
      <option>CN II – Grupo 2</option>
      <option>CN III – Grupo 2</option>
      <option>PN I – Grupo 3</option>
      <option>PN II – Grupo 4</option>`;
  } else {
    select.innerHTML = `
      <option>1° ano A</option>
      <option>2° ano A</option>
      <option>3° ano A</option>`;
  }
}
</script>

// ======== FILTER DATA ========
const DISCIPLINAS = ['Filtrar por disciplina','Matemática','Língua Portuguesa','Ciências','História','Geografia','Arte','Educação Física','Inglês'];
const CAMPOS = ['Filtrar por campo de experiência','Corpo, gestos e movimentos','O eu, o outro e o nós','Traços, sons, cores e formas','Escuta, fala, pensamentos e imaginação','Espaços, tempos, quantidades, relações, transformações','Culturas Regionais'];

let filterSelected = null;

// ======== TIPO TOGGLE ========
function toggleTipoDropdown() {
  const dd = document.getElementById('tipoDropdown');
  dd.classList.toggle('hidden');
  document.getElementById('filterDropdown').classList.add('hidden');
}

function selectTipo(tipo) {
  tipoAtual = tipo;
  filterSelected = null;
  document.getElementById('tipoDropdown').classList.add('hidden');
  const isIndividual = tipo === 'individual';

  // label
  document.getElementById('tipoLabel').textContent = isIndividual ? 'Plano de aula por disciplina' : 'Plano Semanal';
  const defaultLabel = isIndividual ? 'Filtrar por disciplina' : 'Filtrar por campo de experiência';
  document.getElementById('filterLabel').textContent = defaultLabel;
  document.getElementById('modalCriarTitulo').textContent = isIndividual ? 'Plano de aula por disciplina' : 'Plano semanal';

  // tipo-btn color
  const tipoBtn = document.querySelector('.tipo-btn');
  tipoBtn.classList.toggle('semanal', !isIndividual);

  // criar btn color
  const criarBtn = document.querySelector('.btn-criar');
  criarBtn.classList.toggle('blue', !isIndividual);

  // filter disc reset
  const fd = document.getElementById('filterDisc');
  fd.classList.remove('active-orange','active-blue');

  // modal icon color
  const modalIcon = document.querySelector('.modal-criar-header .logo-like');
  if (modalIcon) modalIcon.style.background = isIndividual ? '#fff0e8' : '#eef0fb';

  // dropdown selected
  document.querySelectorAll('.tipo-dropdown-item').forEach((el, i) => {
    el.classList.toggle('selected', (i===0&amp;&amp;isIndividual)||(i===1&amp;&amp;!isIndividual));
  });

  applyTipoColors();
  render();
}

// ======== FILTER DROPDOWN ========
function toggleFilterDropdown() {
  const dd = document.getElementById('filterDropdown');
  const isHidden = dd.classList.contains('hidden');
  document.getElementById('tipoDropdown').classList.add('hidden');
  if (isHidden) {
    const items = tipoAtual === 'individual' ? DISCIPLINAS : CAMPOS;
    dd.innerHTML = items.map((item, i) => `
      <div class=&quot;tipo-dropdown-item ${filterSelected===item||(!filterSelected&amp;&amp;i===0)?'selected':''}&quot;
           onclick=&quot;selectFilter('${item}', ${i})&quot;>
        ${item}
      </div>`).join('');
    dd.classList.remove('hidden');
  } else {
    dd.classList.add('hidden');
  }
}

function selectFilter(item, idx) {
  filterSelected = idx === 0 ? null : item;
  document.getElementById('filterLabel').textContent = item;
  document.getElementById('filterDropdown').classList.add('hidden');
  const fd = document.getElementById('filterDisc');
  fd.classList.remove('active-orange','active-blue');
  if (idx !== 0) fd.classList.add(tipoAtual === 'individual' ? 'active-orange' : 'active-blue');
  render();
}

function filterPlans() { if (tipoAtual === 'individual') render(); }

// ======== MODAL CRIAR ========
function openCriarModal() {
  if (tipoAtual === 'semanal') {
    document.getElementById('modalSemanal').classList.remove('hidden');
  } else {
    document.getElementById('modalCriar').classList.remove('hidden');
  }
}
function closeModal() {
  document.getElementById('modalCriar').classList.add('hidden');
  document.getElementById('modalSemanal').classList.add('hidden');
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalCriar')) closeModal();
}
function concluirSemanal() {
  document.getElementById('modalSemanal').classList.add('hidden');
  PLANOS_SEMANAL.semanas[1].bloqueada = false;
  render();
}

const DIAS_NOMES = ['SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA'];
const DIAS_FULL  = ['Segunda','Terça','Quarta','Quinta','Sexta'];

function abrirFormPlanoIndividual() {
  document.getElementById('modalCriar').classList.add('hidden');

}

};
function atualizarSeries() {
  const nivel = document.getElementById('nivelEnsino').value;
  const sel = document.getElementById('serieAno');
  sel.innerHTML = '<option value=&quot;&quot;>Selecione uma opção</option>' +

}
function selectDuracao(el) {
  document.querySelectorAll('.duracao-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}
function selectAcervo(v) {
  document.getElementById('acervoPublico').classList.toggle('selected', v === 'publico');
  document.getElementById('acervoPrivado').classList.toggle('selected', v === 'privado');
}

function abrirAdicionarPlano(label, num, mes) {
  _diaAtual = { label, num, mes };
  const nomeDia = DIAS_FULL[DIAS_NOMES.indexOf(label)] || label;
  document.getElementById('iaManualDia').textContent = `${nomeDia}, ${num} de ${mes} de 2026`;
  document.getElementById('modalIaManual').classList.remove('hidden');
}

function abrirFormPlano() {
  document.getElementById('modalIaManual').classList.add('hidden');
  if (_diaAtual) {
    const nomeDia = DIAS_FULL[DIAS_NOMES.indexOf(_diaAtual.label)] || _diaAtual.label;
    document.getElementById('formPlanoData').textContent = `${nomeDia}, ${_diaAtual.num} de ${_diaAtual.mes} de 2026`;
  }
  document.getElementById('modalFormPlano').classList.remove('hidden');
}

function toggleCampo(el) { el.classList.toggle('selected'); }

function selectVisib(v) {
  document.getElementById('visibPublico').classList.toggle('selected', v === 'publico');
  document.getElementById('visibPrivado').classList.toggle('selected', v === 'privado');
}

// close all dropdowns on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.tipo-btn') &amp;&amp; !e.target.closest('#tipoDropdown'))
    document.getElementById('tipoDropdown').classList.add('hidden');
  if (!e.target.closest('#filterDisc') &amp;&amp; !e.target.closest('#filterDropdown'))
    document.getElementById('filterDropdown').classList.add('hidden');
});

// ======== APPLY COLORS ========
function applyTipoColors() {
  const isIndividual = tipoAtual === 'individual';
  const color     = isIndividual ? '#f26522' : '#1e4db7';
  const iconBg    = isIndividual ? '#fff0e8' : '#eef0fb';
  const shadow    = isIndividual ? 'rgba(242,101,34,0.12)' : 'rgba(30,77,183,0.12)';

  // CSS vars on modal body
  const body = document.querySelector('.modal-criar-body');
  if (body) {
    body.style.setProperty('--tipo-color',   color);
    body.style.setProperty('--tipo-shadow',  shadow);
    body.style.setProperty('--tipo-icon-bg', iconBg);
  }

  // icon backgrounds + svg stroke
  ['iconIA','iconManual'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.background = iconBg;
    const svgEl = document.getElementById(id + 'Svg');
    if (svgEl) svgEl.setAttribute('stroke', color);
  });

  // modal header icon
  const headerIcon = document.querySelector('.modal-criar-header > div > div:first-child');
  if (headerIcon) {
    headerIcon.style.background = iconBg;
    const s = headerIcon.querySelector('svg');
    if (s) s.setAttribute('stroke', color);
  }
}

// ======== INIT ========
document.getElementById('modalCriarTitulo').textContent = 'Plano de aula por disciplina';
applyTipoColors();
render();

if (_criar === 'individual') { selectTipo('individual'); openCriarModal(); }
if (_criar === 'semanal')    { selectTipo('semanal');    openCriarModal(); }
</script>

const TODOS = [

  // Semanais — Ed. Infantil
  { titulo:'Explorando texturas',   desc:'Atividades sensoriais com diferentes texturas e materiais...', badge:'Ed. Infantil – CN III', serie:'Ed. Infantil – CN III', data:'25 de maio de 2026', visib:'Público', tipo:'blue', tags:['Corpo, gestos e mov.','Traços, sons, cores'] },
  { titulo:'Histórias e fantasias', desc:'Narrativas imaginárias e contação de histórias em grupo...',   badge:'Ed. Infantil – CN III', serie:'Ed. Infantil – CN III', data:'26 de maio de 2026', visib:'Público', tipo:'blue', tags:['Escuta, fala e pensamentos','O eu, o outro e o nós'] },
  { titulo:'Brincando com o corpo', desc:'Movimentos, ritmo e consciência corporal através de jogos...',  badge:'Ed. Infantil – CN III', serie:'Ed. Infantil – CN III', data:'27 de maio de 2026', visib:'Público', tipo:'blue', tags:['Corpo, gestos e mov.','O eu, o outro e o nós'] },
  { titulo:'Descobrindo cores',     desc:'Experimentação com tintas, pigmentos e misturas de cores...',  badge:'Ed. Infantil – CN III', serie:'Ed. Infantil – CN III', data:'28 de maio de 2026', visib:'Público', tipo:'blue', tags:['Traços, sons, cores e formas','Escuta, fala e pensamentos'] },
  { titulo:'Música e movimento',    desc:'Ritmo, dança e expressão musical com instrumentos simples...', badge:'Ed. Infantil – CN III', serie:'Ed. Infantil – CN III', data:'29 de maio de 2026', visib:'Público', tipo:'blue', tags:['Corpo, gestos e mov.','Traços, sons, cores'] },
];

let filtroAtual = 'todos';
let filtroDisc  = '';
let filtroCampo = '';

function setFiltro(tipo) {
  filtroAtual = tipo;
  filtroDisc  = '';
  filtroCampo = '';

  const fd = document.getElementById('filtroDisc');
  const fc = document.getElementById('filtroCampo');

  fd.value = ''; fc.value = '';

  if (tipo === 'orange') {
    fd.disabled = false; fd.style.opacity = '1';
    fc.disabled = true;  fc.style.opacity = '0.4';
  } else if (tipo === 'blue') {
    fc.disabled = false; fc.style.opacity = '1';
    fd.disabled = true;  fd.style.opacity = '0.4';
  } else {
    fd.disabled = true; fd.style.opacity = '0.4';
    fc.disabled = true; fc.style.opacity = '0.4';
  }
  render();
}

function setFiltroDisc(val)  { filtroDisc  = val; render(); }
function setFiltroCampo(val) { filtroCampo = val; render(); }

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const planos = TODOS.filter(p => {
    if (filtroAtual !== 'todos' &amp;&amp; p.tipo !== filtroAtual) return false;
    if (filtroDisc  &amp;&amp; p.badge !== filtroDisc) return false;
    if (filtroCampo &amp;&amp; !p.tags.some(t => t === filtroCampo)) return false;
    if (q &amp;&amp; !p.titulo.toLowerCase().includes(q) &amp;&amp; !p.badge.toLowerCase().includes(q)) return false;
    return true;
  });
  const grid = document.getElementById('plansGrid');

  if (!planos.length) {
    grid.innerHTML = '<div class=&quot;empty-state&quot; style=&quot;grid-column:1/-1;&quot;>Nenhum plano encontrado.</div>';
    return;
  }

  grid.innerHTML = planos.map(p => `
    <div class=&quot;plan-card&quot;>
      <div class=&quot;plan-card-preview ${p.tipo}&quot;>
        <div class=&quot;preview-top&quot;>
          <span class=&quot;badge-visib ${p.visib === 'Público' ? 'publico' : 'privado'}&quot;>
            <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; width=&quot;12&quot; height=&quot;12&quot;>
              ${p.visib === 'Público'
                ? '<path d=&quot;M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z&quot;/><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;3&quot;/>'
                : '<rect x=&quot;3&quot; y=&quot;11&quot; width=&quot;18&quot; height=&quot;11&quot; rx=&quot;2&quot;/><path d=&quot;M7 11V7a5 5 0 0110 0v4&quot;/>'}
            </svg>
            ${p.visib}
          </span>
          <div class=&quot;ia-diamond&quot;>
            <svg viewBox=&quot;0 0 24 24&quot; width=&quot;16&quot; height=&quot;16&quot; fill=&quot;#3b82f6&quot;><path d=&quot;M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z&quot;/></svg>
          </div>
        </div>
        <div class=&quot;preview-bottom&quot;>
          <div class=&quot;trash-btn&quot; onclick=&quot;event.stopPropagation()&quot;>
            <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><polyline points=&quot;3 6 5 6 21 6&quot;/><path d=&quot;M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6&quot;/><path d=&quot;M10 11v6M14 11v6&quot;/><path d=&quot;M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2&quot;/></svg>
          </div>
        </div>
      </div>
      <div class=&quot;plan-card-body&quot;>
        <div class=&quot;plan-card-title&quot;>${p.titulo}</div>
        <div class=&quot;plan-card-desc&quot;>${p.desc}</div>
        <span class=&quot;disc-badge ${p.tipo}&quot;>${p.badge}</span>
        ${p.tags.length ? `<div class=&quot;tags-row&quot;>${p.tags.map(t=>`<span class=&quot;tag-exp&quot;>${t}</span>`).join('')}</div>` : ''}
        <div class=&quot;plan-card-meta&quot;>
          <div class=&quot;plan-meta-row&quot;>
            <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><rect x=&quot;3&quot; y=&quot;4&quot; width=&quot;18&quot; height=&quot;18&quot; rx=&quot;2&quot;/><line x1=&quot;16&quot; y1=&quot;2&quot; x2=&quot;16&quot; y2=&quot;6&quot;/><line x1=&quot;8&quot; y1=&quot;2&quot; x2=&quot;8&quot; y2=&quot;6&quot;/><line x1=&quot;3&quot; y1=&quot;10&quot; x2=&quot;21&quot; y2=&quot;10&quot;/></svg>
            ${p.data}
          </div>
          <div class=&quot;plan-meta-row&quot;>
            <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M22 10v6M2 10l10-5 10 5-10 5z&quot;/><path d=&quot;M6 12v5c3 3 9 3 12 0v-5&quot;/></svg>
            ${p.serie}
          </div>
        </div>
      </div>
    </div>`).join('');
}

const DIAS_PT = { 'Segunda':'Segunda-feira', 'Terça':'Terça-feira', 'Quarta':'Quarta-feira', 'Quinta':'Quinta-feira', 'Sexta':'Sexta-feira' };

// Semana de aulas: 5 dias em sequência (Seg→Sex), com datas reais
const SEMANA_AULAS = [
  { dia: 'Segunda-feira', data: '01 de junho de 2026', num: 1 },
  { dia: 'Terça-feira',   data: '02 de junho de 2026', num: 2 },
  { dia: 'Quarta-feira',  data: '03 de junho de 2026', num: 3 },

  { dia: 'Sexta-feira',   data: '05 de junho de 2026', num: 5 },
];

// Retorna o próximo dia sem plano criado (cicla dentro da semana de 5 dias)
function getProximoDiaSemanal() {
  const criados = TODOS.filter(p => p.tipo === 'blue').length;
  const idx = criados % 5; // sempre entre 0 e 4
  return { ...SEMANA_AULAS[idx], criados: idx };
}

function fecharTudo() {
  ['modalEscolha','modalIaManual','modalFormPlano','modalFormSemanal'].forEach(id =>
    document.getElementById(id).classList.add('hidden'));
}

function abrirPeriodoSemanal() {
  _fluxoAtual = 'semanal';
  document.getElementById('modalEscolha').classList.add('hidden');
  document.getElementById('modalIaManual').classList.remove('hidden');
}

let _fluxoAtual = 'individual'; // 'individual' | 'semanal'
let _diaSelecionado = '';

function abrirIndividual() {
  _fluxoAtual = 'individual';
  document.getElementById('modalEscolha').classList.add('hidden');
  document.getElementById('modalIaManual').classList.remove('hidden');
}

function abrirFormPlano() {
  document.getElementById('modalIaManual').classList.add('hidden');
  if (_fluxoAtual === 'semanal') {
    const proximo = getProximoDiaSemanal();
    const criados = proximo.criados;
    const total   = SEMANA_AULAS.length;

    // Atualiza o header da modal com dia + progresso
    document.getElementById('formSemanalDiaNome').textContent = proximo.dia;
    document.getElementById('formSemanalDiaData').textContent = proximo.data;
    document.getElementById('formSemanalProgresso').textContent = `Plano ${criados + 1} de ${total} da semana`;

    // Preenche as bolinhas de progresso
    document.querySelectorAll('.fs-dot').forEach((dot, i) => {
      dot.classList.toggle('done',  i < criados);
      dot.classList.toggle('atual', i === criados);
      dot.classList.toggle('vazio', i > criados);
    });

    document.getElementById('modalFormSemanal').classList.remove('hidden');
  } else {
    document.getElementById('modalFormPlano').classList.remove('hidden');
  }
}

function selVisibS(v) {
  document.getElementById('visibPS').classList.toggle('selected', v === 'publico');

  if (_saved &amp;&amp; _saved[key]) return _saved[key];
  return params.get(key) || def;
}

const turma   = _get('turma',   '2° ano A');

function togglePres(nome, btn) {
  const key = nome.replace(/\s/g,'_');
  const justif = document.getElementById('j_' + key);
  if (btn.classList.contains('presente')) {
    btn.classList.remove('presente');
    btn.classList.add('falta');
    btn.textContent = 'Falta';
    if (justif) justif.style.display = '';
  } else {
    btn.classList.remove('falta');
    btn.classList.add('presente');
    btn.textContent = 'Presente';
    if (justif) justif.style.display = 'none';
  }
}

let planoVinculado = null;

function abrirVincularPlano() {
  const isInfantil = tipo === 'infantil';
  const isBlueModal = isInfantil;

  // filtra planos compatíveis
  const planos = TODOS_PLANOS.filter(p => {
    if (isInfantil) return p.campos.some(c => c.toLowerCase().includes(disc.toLowerCase()) || disc.toLowerCase().includes(c.toLowerCase()));
    else return p.disc.toLowerCase() === disc.toLowerCase();
  });

  // tag de filtro
  const tagEl = document.getElementById('mvFilterTag');
  tagEl.innerHTML = `<span class=&quot;mv-filter-tag ${isBlueModal?'blue':''}&quot;>${isInfantil ? '🎨 ' + disc : '📚 ' + disc}</span>`;

  // lista de planos
  const listEl = document.getElementById('mvList');
  if (planos.length === 0) {
    listEl.innerHTML = `
      <div class=&quot;mv-empty&quot;>
        <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot;><path d=&quot;M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z&quot;/></svg>
        Nenhum plano criado com ${isInfantil ? 'este campo de experiência' : 'esta disciplina'}.<br>Crie um plano no Planejamento primeiro.
      </div>`;
  } else {
    listEl.innerHTML = planos.map(p => `
      <div class=&quot;mv-plan-card ${isBlueModal?'blue':''}&quot; onclick=&quot;vincularPlano(${p.id})&quot;>
        <div class=&quot;mv-plan-icon&quot;>
          <svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot;><path d=&quot;M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z&quot;/></svg>
        </div>
        <div class=&quot;mv-plan-info&quot;>
          <div class=&quot;mv-plan-title&quot;>${p.titulo}</div>
          <div class=&quot;mv-plan-meta&quot;>${p.data} · ${p.serie}</div>
          <div class=&quot;mv-plan-tags&quot;>
            ${p.campos.length ? p.campos.map(c=>`<span class=&quot;mv-tag mv-tag-blue&quot;>${c}</span>`).join('') : `<span class=&quot;mv-tag mv-tag-orange&quot;>${p.disc}</span>`}
          </div>
        </div>
        <button class=&quot;mv-btn-vincular ${isBlueModal?'blue':''}&quot; onclick=&quot;event.stopPropagation();vincularPlano(${p.id})&quot;>Vincular</button>
      </div>`).join('');
  }

  document.getElementById('modalVincular').classList.remove('hidden');
}

<script>
  var frames = {};
  document.querySelectorAll('iframe.screen').forEach(function(f){
    frames[f.dataset.name] = f;
    f.addEventListener('load', function(){ wire(f); });
  });
  function show(name){
    Object.keys(frames).forEach(function(k){ frames[k].classList.remove('active'); });
    if(frames[name]) frames[name].classList.add('active');
  }
  function wire(f){
    try{
      var doc = f.contentDocument;
      doc.querySelectorAll('a[href$=".html"]').forEach(function(a){
        a.addEventListener('click', function(e){
          e.preventDefault();
          var target = a.getAttribute('href').replace('.html','');
          if(frames[target]) show(target);
        });
      });
    }catch(err){}
  }
  show('index');
</script>
