<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eProf - Plano de aula</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); background: var(--branco); color: var(--texto); min-height: 100vh; }

    /* TOPBAR */
    .dp-topbar { background: var(--bg); border-bottom: 1px solid var(--borda); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .dp-topbar-left { display: flex; align-items: center; gap: 10px; }
    .dp-org { font-size: 13px; color: var(--texto-suave); }
    .dp-topbar-right { display: flex; align-items: center; gap: 10px; }
    .dp-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(160deg, var(--laranja), var(--azul)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
    .dp-user-role { font-size: 12px; color: var(--texto-suave); }

    .back-link { padding: 14px 32px 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--laranja); cursor: pointer; text-decoration: none; width: fit-content; }
    .back-link:hover { opacity: 0.8; }
    .back-link svg { width: 14px; height: 14px; }

    .dp-wrap { max-width: 860px; margin: 0 auto; padding: 18px 32px 80px; }

    /* CAPA */
    .dp-capa { background: var(--bg); border: 1px solid var(--borda); border-radius: var(--raio); height: 190px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; background-size: cover; background-position: center; }
    .dp-capa:hover { border-color: var(--laranja); }
    .dp-capa-add { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--texto-suave); font-size: 13px; pointer-events: none; }
    .dp-capa-add svg { width: 28px; height: 28px; border-radius: 50%; background: var(--branco); border: 1px solid var(--borda); padding: 6px; box-sizing: border-box; }
    .dp-capa.tem-imagem .dp-capa-add { display: none; }
    .btn-pdf { position: absolute; bottom: 14px; right: 14px; background: var(--laranja); color: #fff; border: none; border-radius: 9px; padding: 9px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; }
    .btn-pdf:hover { background: var(--laranja-escuro); }

    /* HEADER DO PLANO */
    .dp-header { background: var(--branco); border: 1px solid var(--borda); border-top: none; border-radius: 0 0 var(--raio) var(--raio); padding: 20px 24px 22px; margin-bottom: 20px; }
    .dp-titulo-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--borda); padding-bottom: 14px; margin-bottom: 12px; }
    .dp-titulo { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--texto); flex: 1; outline: none; }
    .dp-titulo:empty::before { content: attr(data-placeholder); color: #b0b7c0; }
    .dp-lapis { color: var(--texto-suave); flex-shrink: 0; cursor: pointer; }
    .dp-lapis:hover { color: var(--laranja); }
    .dp-tema { font-size: 13px; color: var(--texto-suave); margin-bottom: 12px; }

    .dp-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .dp-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; }
    .dp-badge.serie { background: var(--azul-claro); color: var(--azul); }
    .dp-badge.metodologia { background: var(--laranja-bg); color: var(--laranja-escuro); }
    .dp-campos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .dp-campo-chip { background: var(--azul-claro); color: var(--azul); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }

    .dp-footer-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .dp-data { font-size: 12.5px; color: var(--texto-suave); display: flex; align-items: center; gap: 6px; }
    .dp-visib-group { display: flex; gap: 8px; }
    .dp-visib-btn { border: 1.5px solid var(--borda); border-radius: 9px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: var(--texto-suave); cursor: pointer; display: flex; align-items: center; gap: 7px; background: var(--branco); }
    .dp-visib-btn.selected.pub { border-color: #2E8B00; color: #2E8B00; background: var(--verde-bg); }
    .dp-visib-btn.selected.priv { border-color: var(--azul); color: var(--azul); background: var(--azul-claro); }

    /* SEÇÕES */
    .dp-secao { background: var(--branco); border: 1px solid var(--borda); border-radius: var(--raio-sm); padding: 18px 20px; margin-bottom: 14px; display: flex; gap: 14px; align-items: flex-start; transition: box-shadow .15s, opacity .15s; }
    .dp-secao.arrastando { opacity: .4; }
    .dp-secao.alvo-drop { box-shadow: 0 0 0 2px var(--azul) inset; }
    .dp-secao-corpo { flex: 1; min-width: 0; }
    .dp-secao-titulo { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--texto); margin-bottom: 8px; outline: none; }
    .dp-secao-texto { font-size: 13.5px; line-height: 1.6; color: var(--texto-suave); outline: none; white-space: pre-wrap; min-height: 22px; }
    .dp-secao-texto:empty::before { content: attr(data-placeholder); color: #b0b7c0; }
    .dp-secao-acoes { display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; }
    .dp-grip { cursor: grab; color: #c7cdd4; padding: 2px; }
    .dp-grip:active { cursor: grabbing; }
    .dp-lixeira { cursor: pointer; color: #c7cdd4; padding: 2px; }
    .dp-lixeira:hover { color: var(--vermelho); }

    .dp-add-secao { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 1.5px dashed var(--borda); border-radius: var(--raio-sm); padding: 14px; background: none; color: var(--texto-suave); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-display); }
    .dp-add-secao:hover { border-color: var(--laranja); color: var(--laranja); background: var(--laranja-bg); }

    .dp-nova-secao-form { background: var(--bg); border: 1px solid var(--borda); border-radius: var(--raio-sm); padding: 16px 18px; margin-bottom: 14px; display: none; }
    .dp-nova-secao-form.ativo { display: block; }
    .dp-nova-secao-form input { width: 100%; border: 1px solid var(--borda); border-radius: 9px; padding: 10px 12px; font-size: 13.5px; font-family: var(--font-display); margin-bottom: 10px; }
    .dp-nova-secao-form input:focus { outline: none; border-color: var(--laranja); }
    .dp-nova-secao-acoes { display: flex; gap: 8px; justify-content: flex-end; }
    .dp-btn-sec-cancelar { border: 1px solid var(--borda); background: var(--branco); border-radius: 9px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: var(--texto-suave); cursor: pointer; }
    .dp-btn-sec-criar { border: none; background: var(--laranja); color: #fff; border-radius: 9px; padding: 8px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .dp-btn-sec-criar:hover { background: var(--laranja-escuro); }

    @media print {
      .dp-topbar, .back-link, .btn-pdf, .dp-add-secao, .dp-nova-secao-form, .dp-secao-acoes { display: none !important; }
      .dp-wrap { padding: 0; max-width: none; }
      .dp-secao { border: none; box-shadow: none; padding: 10px 0; }
      body { background: #fff; }
    }
  </style>
</head>
<body>

<div class="dp-topbar">
  <div class="dp-topbar-left">
    <span class="dp-org">Educação Municipal de Porto Seguro</span>
  </div>
  <div class="dp-topbar-right">
    <span class="dp-user-role">Professor</span>
    <div class="dp-avatar">YD</div>
  </div>
</div>

<a href="planejamento2.html" class="back-link">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Voltar para planejamento
</a>

<div class="dp-wrap">

  <div class="dp-capa" id="dpCapa" onclick="document.getElementById('dpCapaInput').click()">
    <div class="dp-capa-add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar capa
    </div>
    <button class="btn-pdf" onclick="event.stopPropagation();window.print()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><polyline points="14 2 14 8 20 8"/></svg>
      Baixar PDF
    </button>
  </div>
  <input type="file" id="dpCapaInput" accept="image/*" style="display:none" onchange="definirCapa(this.files[0])" />

  <div class="dp-header">
    <div class="dp-titulo-row">
      <div class="dp-titulo" id="dpTitulo" contenteditable="true" data-placeholder="Título do plano" oninput="salvar()"></div>
      <svg class="dp-lapis" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="document.getElementById('dpTitulo').focus()"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </div>
    <div class="dp-tema" id="dpTema"></div>
    <div class="dp-badges" id="dpBadges"></div>
    <div class="dp-campos" id="dpCampos"></div>
    <div class="dp-footer-row">
      <div class="dp-data" id="dpData">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="dp-visib-group">
        <div class="dp-visib-btn pub" id="dpVisibPub" onclick="setVisib('Público')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Público
        </div>
        <div class="dp-visib-btn priv" id="dpVisibPriv" onclick="setVisib('Privado')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Privado
        </div>
      </div>
    </div>
  </div>

  <div id="dpSecoes"></div>

  <div class="dp-nova-secao-form" id="dpNovaSecaoForm">
    <input type="text" id="dpNovaSecaoTitulo" placeholder="Título da nova seção (ex: Observações)" />
    <div class="dp-nova-secao-acoes">
      <button class="dp-btn-sec-cancelar" onclick="cancelarNovaSecao()">Cancelar</button>
      <button class="dp-btn-sec-criar" onclick="confirmarNovaSecao()">Adicionar seção</button>
    </div>
  </div>

  <button class="dp-add-secao" onclick="abrirNovaSecao()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Adicionar nova seção
  </button>

</div>

<script>
let PLANO = JSON.parse(localStorage.getItem('planoSemanalAtual') || 'null');
if (!PLANO) {
  // acesso direto sem vir da criação: evita tela quebrada
  PLANO = { titulo:'', tema:'', serie:'', metodologia:'', campos:[], visib:'Público', dataCriacao: new Date().toLocaleDateString('pt-BR'), secoes: [] };
}

function salvar() {
  PLANO.titulo = document.getElementById('dpTitulo').textContent.trim();
  localStorage.setItem('planoSemanalAtual', JSON.stringify(PLANO));
}

function renderHeader() {
  document.getElementById('dpTitulo').textContent = PLANO.titulo || '';
  document.getElementById('dpTema').textContent = PLANO.tema ? `Tema: ${PLANO.tema}` : '';

  const badges = [];
  if (PLANO.serie) badges.push(`<span class="dp-badge serie"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>${esc(PLANO.serie)}</span>`);
  if (PLANO.metodologia) badges.push(`<span class="dp-badge metodologia"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>${esc(PLANO.metodologia)}</span>`);
  document.getElementById('dpBadges').innerHTML = badges.join('');

  document.getElementById('dpCampos').innerHTML = (PLANO.campos || [])
    .map(c => `<span class="dp-campo-chip">${esc(c)}</span>`).join('');

  document.getElementById('dpData').innerHTML =
    `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${esc(PLANO.dataCriacao || '')}`;

  setVisib(PLANO.visib || 'Público', true);

  if (PLANO.capa) {
    const capa = document.getElementById('dpCapa');
    capa.style.backgroundImage = `url('${PLANO.capa}')`;
    capa.classList.add('tem-imagem');
  }
}

function setVisib(v, semSalvar) {
  PLANO.visib = v;
  document.getElementById('dpVisibPub').classList.toggle('selected', v === 'Público');
  document.getElementById('dpVisibPriv').classList.toggle('selected', v === 'Privado');
  if (!semSalvar) salvar();
}

function definirCapa(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    PLANO.capa = e.target.result;
    const capa = document.getElementById('dpCapa');
    capa.style.backgroundImage = `url('${PLANO.capa}')`;
    capa.classList.add('tem-imagem');
    salvar();
  };
  reader.readAsDataURL(file);
}

function renderSecoes() {
  const el = document.getElementById('dpSecoes');
  el.innerHTML = PLANO.secoes.map((s, i) => `
    <div class="dp-secao" draggable="true" data-idx="${i}"
         ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event,${i})"
         ondragleave="onDragLeave(event)" ondrop="onDrop(event,${i})" ondragend="onDragEnd(event)">
      <div class="dp-secao-corpo">
        <div class="dp-secao-titulo" contenteditable="true" oninput="editarSecao(${i},'titulo',this.textContent)">${esc(s.titulo)}</div>
        <div class="dp-secao-texto" contenteditable="true" data-placeholder="${esc(s.placeholder || 'Escreva aqui...')}"
             oninput="editarSecao(${i},'texto',this.textContent)">${esc(s.texto)}</div>
      </div>
      <div class="dp-secao-acoes">
        <svg class="dp-grip" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>
        <svg class="dp-lixeira" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="excluirSecao(${i})"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </div>
    </div>`).join('');
}

function editarSecao(i, campo, valor) {
  PLANO.secoes[i][campo] = valor;
  salvar();
}

function excluirSecao(i) {
  PLANO.secoes.splice(i, 1);
  salvar();
  renderSecoes();
}

// --- reordenar por arrastar ---
let _dragIdx = null;
function onDragStart(e, i) {
  _dragIdx = i;
  e.currentTarget.classList.add('arrastando');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e, i) {
  e.preventDefault();
  if (i !== _dragIdx) e.currentTarget.classList.add('alvo-drop');
}
function onDragLeave(e) { e.currentTarget.classList.remove('alvo-drop'); }
function onDragEnd(e) {
  document.querySelectorAll('.dp-secao').forEach(el => el.classList.remove('arrastando', 'alvo-drop'));
}
function onDrop(e, i) {
  e.preventDefault();
  e.currentTarget.classList.remove('alvo-drop');
  if (_dragIdx === null || _dragIdx === i) return;
  const [mov] = PLANO.secoes.splice(_dragIdx, 1);
  PLANO.secoes.splice(i, 0, mov);
  _dragIdx = null;
  salvar();
  renderSecoes();
}

// --- adicionar seção ---
function abrirNovaSecao() {
  document.getElementById('dpNovaSecaoForm').classList.add('ativo');
  const input = document.getElementById('dpNovaSecaoTitulo');
  input.value = '';
  input.focus();
}
function cancelarNovaSecao() {
  document.getElementById('dpNovaSecaoForm').classList.remove('ativo');
}
function confirmarNovaSecao() {
  const titulo = document.getElementById('dpNovaSecaoTitulo').value.trim();
  if (!titulo) return;
  PLANO.secoes.push({ titulo, texto: '', placeholder: 'Escreva aqui...' });
  salvar();
  renderSecoes();
  cancelarNovaSecao();
  requestAnimationFrame(() => {
    const ultima = document.querySelectorAll('.dp-secao-texto');
    ultima[ultima.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function esc(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderHeader();
renderSecoes();
</script>

</body>
</html>
