function selectTurma(turma) {
  currentTurma = turma;

function renderInfoBar() {

    document.getElementById('infoFields').innerHTML = `
      <span class="info-label">${svg('users')} Turma</span>      <span class="info-value">${t.nome}</span>
      <span class="info-label">${svg('cal')} Disciplina</span>   <span class="info-value"><span class="badge-discipline">${t.disc}</span></span>
      <span class="info-label">${svg('pin')} Escola</span>       <span class="info-value">${t.escola}</span>
      <span class="info-label">${svg('clock')} Turno</span>      <span class="info-value">${t.turno}</span>
    `;
    document.getElementById('topbarActions').innerHTML = `
      <div class="select-turma-btn" onclick="openModal('modalSelecionar')">${svg('ext')} Selecionar turma</div>
    `;
    const pct = Math.round((t.presentes / t.total) * 100);
    document.getElementById('progressLabel').textContent = `${t.presentes} de ${t.total} alunos`;
    document.getElementById('progressPct').textContent = `${pct}%`;
    document.getElementById('progressFill').className = 'progress-fill fill-orange';
    document.getElementById('progressFill').style.width = pct + '%';
  } else {
    document.getElementById('infoFields').innerHTML = `
      <span class="info-label">${svg('users')} Turma</span>         <span class="info-value">${t.nome}</span>
      <span class="info-label">${svg('cal')} Grupo / Faixa</span>   <span class="info-value"><span class="badge-blue">${t.tag} · ${t.faixa}</span></span>

function renderTabs() {
  const isInfantil = !!currentTurma.tag;
  const tabs = isInfantil
    ? [['inicio','Início',svg('home')],['criancas','Crianças',svg('users')],['periodos','Períodos',svg('cal')],['ocorrencias','Ocorrências',svg('warn')],['acervo','Acervo',svg('folder')]]
    : [['inicio','Início',svg('home')],['alunos','Alunos',svg('users')],['aulas','Aulas',svg('cal')],['ocorrencias','Ocorrências',svg('warn')],['notas','Notas',svg('doc')],['acervo','Acervo',svg('folder')]];
  document.getElementById('tabsBar').innerHTML = tabs.map(([id,label,icon]) =>
    `<div class="tab ${id===currentTab?'active':''}" onclick="switchTab('${id}')">${icon} ${label}</div>`
  ).join('');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().toLowerCase().startsWith(tab === 'criancas' ? 'crian' : tab.charAt(0)));
  });
  // re-render tabs to update active properly
  renderTabs();
  renderContent();
}

// ============ MODAIS ============
function openModal(id) {
  if (id === 'modalSelecionar') renderModalList();
  document.getElementById(id).classList.remove('hidden');
}
function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.add('hidden'); });
});

function switchModalTab(tab) {
  modalTab = tab;
  document.getElementById('toggleRegular').className = 'toggle-btn' + (tab==='regular'?' active':'');
  document.getElementById('toggleInfantil').className = 'toggle-btn' + (tab==='infantil'?' active blue':'');
  renderModalList();
}

        <div class="turma-row-right">
          <span class="badge-tag">${t.tag}</span>
          <svg class="turma-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>

function pickTurma(id) {
  closeModal('modalSelecionar');
  const t = [...TURMAS_REGULAR, ...TURMAS_INFANTIL].find(x => x.id === id);
  if (t) selectTurma(t);
}

function openHorarios() {
  const t = currentTurma;
  document.getElementById('horariosSubtitle').textContent = `${t.nome} · ${t.tag.split('·')[0].trim()}`;
  document.getElementById('horariosBody').innerHTML = t.horarios.map(h => `
    <div class="horario-row">
      <span>${h.nome}</span>
      <span class="horario-time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${h.inicio} – ${h.fim}</span>
    </div>`).join('') + `
    <div class="horario-footer">
      <span>Turno: <strong style="color:#f26522">${t.turno.split('·')[0].trim()}</strong></span>
      <span>Total: <strong>${calcHoras(t.horarios)}</strong></span>
    </div>`;
  openModal('modalHorarios');
}

function calcHoras(horarios) {
  const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
  const ini = toMin(horarios[0].inicio);
  const fim = toMin(horarios[horarios.length-1].fim);
  const diff = fim - ini;
  return diff % 60 === 0 ? `${diff/60} horas` : `${Math.floor(diff/60)}h${diff%60}min`;
}

  return map[name] || '';
}
